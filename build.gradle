plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nomelestar'
version = '0.0.1-SNAPSHOT'
description = 'repaso'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Por defecto el plugin de Spring Boot genera DOS jars en build/libs:
//   - repaso-0.0.1-SNAPSHOT.jar        -> el ejecutable (fat jar), el que sirve
//   - repaso-0.0.1-SNAPSHOT-plain.jar  -> solo las clases, NO arranca solo
// Tener los dos rompe el "COPY build/libs/*.jar app.jar" del Dockerfile, porque
// el comodín encuentra dos archivos y Docker no sabe cuál copiar.
// Desactivamos el "plain" porque este proyecto no lo usa como librería.
tasks.named('jar') {
    enabled = false
}
